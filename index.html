    function AnimatedCounter({ target, suffix = "" }) {
      const [count, setCount] = useState(0);
      const ref = useRef(null);
      const started = useRef(false);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const io = new IntersectionObserver(([entry]) => {
          if (entry.isIntersecting && !started.current) {
            started.current = true;
            io.disconnect();
            const from = target > 500 ? target - 5 : 0;
            const range = target - from;
            const duration = 1600;
            const t0 = performance.now();
            function tick(now) {
              const p = Math.min((now - t0) / duration, 1);
              const ease = 1 - Math.pow(1 - p, 3);
              setCount(Math.round(from + range * ease));
              if (p < 1) requestAnimationFrame(tick);
            }
            requestAnimationFrame(tick);
          }
        }, { threshold: 0.5 });
        io.observe(el);
        return () => io.disconnect();
      }, [target]);
      return React.createElement("span", { ref }, count + suffix);
    }

    function ContactForm() {
      const initialForm = {
        nombre: "",
        empresa: "",
        cargo: "",
        correo: "",
        celular: "",
        solucionInteres: "",
        necesidad: "",
      };
      const [form, setForm] = useState(initialForm);
      const [status, setStatus] = useState("idle");
      const [message, setMessage] = useState("");
      const contactRoute = [
        ["01", "Entendemos la necesidad", "Revisamos contexto, solución de interés y prioridad del negocio."],
        ["02", "Orientamos la ruta SAP", "Identificamos si el frente es implementación, soporte, mejora o evolución."],
        ["03", "Acordamos siguientes pasos", "Coordinamos una conversación con el equipo consultivo adecuado."],
      ];

      const errors = useMemo(() => {
        const current = {};
        if (!form.nombre.trim()) current.nombre = "El nombre es requerido.";
        if (!form.empresa.trim()) current.empresa = "La empresa es requerida.";
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.correo.trim())) current.correo = "Ingresa un correo válido.";
        if (!form.necesidad.trim()) current.necesidad = "Cuéntanos brevemente la necesidad.";
        return current;
      }, [form]);

      function updateField(event) {
        const { name, value } = event.target;
        setForm((current) => ({ ...current, [name]: value }));
      }

      async function submitForm(event) {
        event.preventDefault();
        setMessage("");
        if (Object.keys(errors).length > 0) {
          setStatus("error");
          setMessage("Revisa los campos requeridos antes de enviar la solicitud.");
          return;
        }

        const payload = {
          nombre: form.nombre.trim(),
          empresa: form.empresa.trim(),
          cargo: form.cargo.trim(),
          correo: form.correo.trim(),
          celular: form.celular.trim(),
          solucionInteres: form.solucionInteres,
          necesidad: form.necesidad.trim(),
          origen: "Landing Flag Soluciones",
          fechaEnvio: new Date().toISOString(),
        };

        try {
          setStatus("loading");
          if (!CONTACT_WEBHOOK_URL || CONTACT_WEBHOOK_URL === "PEGAR_WEBHOOK_AQUI") {
            throw new Error("El webhook de contacto aún no está configurado.");
          }
          const response = await fetch(CONTACT_WEBHOOK_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          if (!response.ok) throw new Error("No fue posible enviar la solicitud.");
          setStatus("success");
          setMessage("Gracias por contactarnos. Nuestro equipo revisará tu solicitud y se comunicará contigo próximamente.");
          setForm(initialForm);
        } catch (error) {
          setStatus("error");
          setMessage(error.message || "No fue posible enviar la solicitud. Inténtalo nuevamente.");
        }
      }

      return (
        <section id="contacto" className="section contact-section" aria-labelledby="contact-title">
          <div className="container">
            <div className="contact-shell">
              <div className="contact-glow contact-glow-one" aria-hidden="true"></div>
              <div className="contact-glow contact-glow-two" aria-hidden="true"></div>
              <div className="contact-copy">
                <span className="eyebrow">Contacto</span>
                <h2 id="contact-title">Hablemos sobre la evolución de su ecosistema SAP</h2>
                <p>Cuéntenos su necesidad y nuestro equipo se comunicará para revisar cómo podemos acompañarlo.</p>
                <div className="contact-route">
                  {contactRoute.map(([number, title, copy], i) => (
                    <article className="contact-route-card" key={title}>
                      <strong>{number}</strong>
                      <h3>{title}</h3>
                      <p>{copy}</p>
                    </article>
                  ))}
                </div>
                <div className="contact-note">
                  <strong>Canales FLAG</strong>
                  <span>{icons.layers({ className: "icon-sm" })} Medellín, Colombia · contacto@flagsoluciones.com</span>
                  <span>{icons.arrow({ className: "icon-sm" })} +57 (604) 444 6609 · +57 314 589 7949</span>
                </div>
              </div>
              <form className="contact-form" onSubmit={submitForm} noValidate>
                <div className="contact-form-head">
                  <span>Solicitud SAP</span>
                  <h3>Cuéntenos cómo podemos acompañarlo</h3>
                  <p>Su solicitud llega directamente al equipo consultivo de FLAG. Comparta los datos clave y prepararemos una conversación útil desde el primer contacto.</p>
                </div>
                <div className="form-grid">
                  <label>
                    Nombre
                    <input name="nombre" value={form.nombre} onChange={updateField} required />
                    {status === "error" && errors.nombre && <span className="form-error-inline">{errors.nombre}</span>}
                  </label>
                  <label>
                    Empresa
                    <input name="empresa" value={form.empresa} onChange={updateField} required />
                    {status === "error" && errors.empresa && <span className="form-error-inline">{errors.empresa}</span>}
                  </label>
                  <label>
                    Cargo
                    <input name="cargo" value={form.cargo} onChange={updateField} />
                  </label>
                  <label>
                    Correo corporativo
                    <input type="email" name="correo" value={form.correo} onChange={updateField} required />
                    {status === "error" && errors.correo && <span className="form-error-inline">{errors.correo}</span>}
                  </label>
                  <label>
                    Celular
                    <input name="celular" value={form.celular} onChange={updateField} />
                  </label>
                  <label>
                    Solución de interés
                    <select name="solucionInteres" value={form.solucionInteres} onChange={updateField}>
                      <option value="">Seleccionar</option>
                      {interestOptions.map((option) => <option key={option} value={option}>{option}</option>)}
                    </select>
                  </label>
                </div>
                <label>
                  Necesidad o mensaje
                  <textarea name="necesidad" rows="5" value={form.necesidad} onChange={updateField} required></textarea>
                  {status === "error" && errors.necesidad && <span className="form-error-inline">{errors.necesidad}</span>}
                </label>
                {message && <div className={`form-message ${status}`}>{message}</div>}
                <button className="btn btn-primary" type="submit" disabled={status === "loading"}>
                  {status === "loading" ? "Enviando..." : <>Enviar solicitud {icons.arrow({ className: "icon-sm" })}</>}
                </button>
              </form>
            </div>
          </div>
        </section>
      );
    }

    function App() {
      useEffect(() => {
        if (!window.IntersectionObserver) return;
        const io = new IntersectionObserver(
          (entries) => entries.forEach(e => {
            if (e.isIntersecting) { e.target.classList.add("sr-vis"); io.unobserve(e.target); }
          }),
          { threshold: 0.06, rootMargin: "0px 0px -32px 0px" }
        );
        requestAnimationFrame(() => {
          document.querySelectorAll(
            ".partner-card,.whyflag-card,.service-card,.accelerator-card,.facts-grid article,.contact-route-card,.section-heading,.solution-detail,.clients-heading,.client-trust-strip,.hero-pillar-card,.solution-tabs"
          ).forEach(el => {
            const r = el.getBoundingClientRect();
            if (r.top < window.innerHeight && r.bottom > 0) {
              el.classList.add("sr-vis");
            } else {
              el.classList.add("sr-init");
              io.observe(el);
            }
          });
        });
        return () => io.disconnect();
      }, []);

      return (
        <>
          <Header />
          <main>
            <Hero />
            <PartnerBadge />
            <ClientsGrid />
            <WhyFlag />
            <Solutions />
            <Services />
            <Accelerators />
            <About />
            <ContactForm />
          </main>
          <Footer />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
